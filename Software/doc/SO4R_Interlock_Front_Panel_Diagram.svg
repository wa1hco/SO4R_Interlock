<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="680" viewBox="0 0 1260 680">
  <style>
    .port { fill: #f4f4f4; stroke: #222; stroke-width: 2; }
    .group-box { fill: rgba(52, 152, 219, 0.05); stroke: #2980b9; stroke-width: 2; }
    .led-border { stroke: #222; stroke-width: 1.5; }
    .led-swatch { fill: #fff; stroke: #222; stroke-width: 1.5; }
    .led-label { font-family: Arial, sans-serif; font-size: 11px; fill: #222; }
    .led-label-off { font-family: Arial, sans-serif; font-size: 11px; fill: #999; font-style: italic; }
    .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; }
    .subtitle { font-family: Arial, sans-serif; font-size: 15px; fill: #444; }
    .legend-box { fill: #fff; stroke: #999; stroke-width: 1.5; }
    .legend-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .legend-text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
    .port-name { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .port-role { font-family: Arial, sans-serif; font-size: 13px; fill: #555; }
    .section-label { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #111; }
    .pin-note { font-family: Arial, sans-serif; font-size: 13px; fill: #333; }
  </style>

  <text x="40" y="40" class="title">SO4R Interlock — Radio/Relay side</text>
  <text x="40" y="68" class="subtitle">RJ45 ports for the four radios and the relay/transfer cable. The computer/USB/power side is on the opposite board edge.</text>

  <!-- Port template: yellow LED upper-left, green LED upper-right. Port name, role,
       and LED meaning labels are drawn per instance so each port can differ. -->
  <defs>
    <g id="port-template">
      <rect class="port" x="0" y="0" width="200" height="148" rx="12" ry="12" />
      <rect class="led-swatch" x="12" y="12" width="44" height="44" rx="9" ry="9" />
      <rect class="led-swatch" x="144" y="12" width="44" height="44" rx="9" ry="9" />
      <circle class="led-border" cx="34" cy="34" r="14" fill="#f7b500" />
      <circle class="led-border" cx="166" cy="34" r="14" fill="#4caf50" />
    </g>
  </defs>

  <!-- Relay / transfer port: left end of the row -->
  <g transform="translate(40, 120)">
    <rect class="group-box" x="-20" y="-36" width="240" height="200" rx="14" ry="14" />
    <text class="section-label" x="100" y="-14" text-anchor="middle">Relay / transfer port</text>

    <use href="#port-template" x="0" y="0" />
    <text class="port-name" x="100" y="92" text-anchor="middle">RLY</text>
    <text class="port-role" x="100" y="112" text-anchor="middle">to relay box</text>
    <text class="led-label" x="34" y="130" text-anchor="middle">WSJT radio</text>
    <text class="led-label" x="34" y="144" text-anchor="middle">inhibited</text>
    <text class="led-label" x="166" y="130" text-anchor="middle">Relays</text>
    <text class="led-label" x="166" y="144" text-anchor="middle">engaged</text>
  </g>

  <!-- Radio interface ports group surrounds RIG1-RIG4 -->
  <g transform="translate(300, 120)">
    <rect class="group-box" x="-20" y="-36" width="900" height="200" rx="14" ry="14" />
    <text class="section-label" x="430" y="-14" text-anchor="middle">Radio interface RJ45 ports (RIG1–RIG4)</text>

    <!-- RIG1 = SSB/CW, highest priority: yellow LED is never lit -->
    <use href="#port-template" x="0" y="0" />
    <circle class="led-border" cx="34" cy="34" r="14" fill="#e6e6e6" />
    <text class="port-name" x="100" y="92" text-anchor="middle">RIG1</text>
    <text class="port-role" x="100" y="112" text-anchor="middle">SSB / CW</text>
    <text class="led-label-off" x="34" y="130" text-anchor="middle">never</text>
    <text class="led-label-off" x="34" y="144" text-anchor="middle">lit</text>
    <text class="led-label" x="166" y="130" text-anchor="middle">Amp</text>
    <text class="led-label" x="166" y="144" text-anchor="middle">granted</text>

    <!-- RIG2-RIG4 = WSJT-X stations -->
    <use href="#port-template" x="220" y="0" />
    <text class="port-name" x="320" y="92" text-anchor="middle">RIG2</text>
    <text class="port-role" x="320" y="112" text-anchor="middle">WSJT-X 2</text>
    <text class="led-label" x="254" y="130" text-anchor="middle">Blocked /</text>
    <text class="led-label" x="254" y="144" text-anchor="middle">inhibited</text>
    <text class="led-label" x="386" y="130" text-anchor="middle">Amp</text>
    <text class="led-label" x="386" y="144" text-anchor="middle">granted</text>

    <use href="#port-template" x="440" y="0" />
    <text class="port-name" x="540" y="92" text-anchor="middle">RIG3</text>
    <text class="port-role" x="540" y="112" text-anchor="middle">WSJT-X 3</text>
    <text class="led-label" x="474" y="130" text-anchor="middle">Blocked /</text>
    <text class="led-label" x="474" y="144" text-anchor="middle">inhibited</text>
    <text class="led-label" x="606" y="130" text-anchor="middle">Amp</text>
    <text class="led-label" x="606" y="144" text-anchor="middle">granted</text>

    <use href="#port-template" x="660" y="0" />
    <text class="port-name" x="760" y="92" text-anchor="middle">RIG4</text>
    <text class="port-role" x="760" y="112" text-anchor="middle">WSJT-X 4</text>
    <text class="led-label" x="694" y="130" text-anchor="middle">Blocked /</text>
    <text class="led-label" x="694" y="144" text-anchor="middle">inhibited</text>
    <text class="led-label" x="826" y="130" text-anchor="middle">Amp</text>
    <text class="led-label" x="826" y="144" text-anchor="middle">granted</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 330)">
    <rect class="legend-box" x="0" y="0" width="1180" height="300" rx="12" ry="12" />
    <text class="legend-title" x="20" y="30">Diagram notes</text>
    <text class="legend-text" x="20" y="58">• Covers only the radio and relay side of the board; the opposite edge carries computer, USB, power, and control.</text>
    <text class="legend-text" x="20" y="81">• The relay/transfer port (RLY) sits at the left end of the row, ahead of the four radio ports (RIG1–RIG4).</text>
    <text class="legend-text" x="20" y="104">• RIG1 is the SSB/CW radio (highest priority); RIG2–RIG4 are WSJT-X stations 2–4.</text>
    <text class="legend-text" x="20" y="127">• Each port has a yellow LED (upper left) and a green LED (upper right).</text>
    <text class="legend-text" x="20" y="150">• Green = amplifier/relays granted (active transmit). Yellow = transmit blocked or inhibited.</text>
    <text class="legend-text" x="20" y="173">• RIG1 never lights yellow — as highest priority the SSB/CW radio is never inhibited.</text>
    <text class="legend-text" x="20" y="196">• Relay port: green = relays engaged; yellow = one or more WSJT radios inhibited.</text>
    <text class="legend-text" x="20" y="219">• At power-up a lamp test ripples across every LED: relay port first, then RIG1 through RIG4.</text>
    <text class="legend-title" x="20" y="255">Standard RJ45 pinout</text>
    <text class="legend-text" x="20" y="283">Pins 1–8: 12 V, CAT, GND, PTT/, GND, KEY/, GND, SPR</text>
  </g>

  <text class="pin-note" x="40" y="660">Source: KiCad PCB and schematic for the SO4R Interlock. Intended for the operator brief as a radio/relay-side reference diagram.</text>
</svg>
